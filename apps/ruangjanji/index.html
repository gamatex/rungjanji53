<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#C86D51"><title>RuangJanji</title><link rel="stylesheet" href="../../packages/shared/style.css"></head><body><header><strong>✦ RuangJanji</strong><small>Undangan digital untuk momen istimewa</small></header><main><section id="auth" class="panel"><h2>Masuk / Daftar</h2><form id="login"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Kata sandi (min. 6 karakter)" minlength="6" required><button type="submit">Masuk</button><button type="button" id="signup" class="secondary">Daftar lewat email</button></form></section><section id="app" hidden><div class="toolbar"><span id="account"></span><button id="logout" class="secondary">Keluar</button></div><nav><button data-tab="catalog">Katalog</button><button data-tab="events">Undangan saya</button></nav><section id="catalog"><h2>Pilih template</h2><div id="themes" class="grid"></div></section><section id="events" hidden><h2>Undangan saya</h2><form id="event-form" class="panel"><input name="title" placeholder="Judul acara" required maxlength="100"><input name="groom" placeholder="Nama mempelai pria" required><input name="bride" placeholder="Nama mempelai wanita" required><input name="slug" placeholder="Alamat unik (huruf kecil dan tanda -)" pattern="[a-z0-9-]{3,80}" required><input name="date" type="date"><input name="time" type="time" value="09:00"><input name="venue" placeholder="Tempat acara"><input name="address" placeholder="Alamat acara"><label>Template <select id="theme-select" name="theme" required></select></label><button type="submit">Simpan draft undangan</button></form><div id="event-list"></div></section></section><p id="message" role="status"></p></main><script type="module" src="./main.js"></script></body></html>
